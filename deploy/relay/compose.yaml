name: cc-remote-relay
services:
  gateway:
    image: caddy:2.11.9-alpine
    network_mode: host
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
  tunnel:
    image: ghcr.io/fatedier/frps:v0.72.0
    user: "65534:65534"
    network_mode: host
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [-c, /etc/frp/frps.toml]
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
      - ./tls/server.crt:/etc/frp/tls/server.crt:ro
      - ./tls/server.key:/etc/frp/tls/server.key:ro
  turn:
    image: coturn/coturn:4.18.0-r0
    user: "65534:65534"
    network_mode: host
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    command: [-c, /etc/coturn/turnserver.conf]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    tmpfs: [/tmp]
volumes:
  caddy_data:
  caddy_config:
